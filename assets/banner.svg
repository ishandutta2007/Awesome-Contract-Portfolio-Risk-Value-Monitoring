<svg width="100%" height="280" viewBox="0 0 1200 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <!-- Glowing Orb Gradients -->
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.35" />
    </pattern>

    <style>
      .glow-pulse-cyan {
        animation: pulseCyan 6s ease-in-out infinite alternate;
      }
      .glow-pulse-purple {
        animation: pulsePurple 7s ease-in-out infinite alternate;
      }
      .wave-line {
        animation: dash 12s linear infinite;
      }
      .data-float {
        animation: floatCard 4s ease-in-out infinite alternate;
      }
      .pulse-node {
        animation: ping 3s cubic-bezier(0, 0, 0.2, 1) infinite;
      }

      @keyframes pulseCyan {
        0% { transform: scale(1) translate(0px, 0px); opacity: 0.3; }
        100% { transform: scale(1.25) translate(30px, 15px); opacity: 0.65; }
      }
      @keyframes pulsePurple {
        0% { transform: scale(1) translate(0px, 0px); opacity: 0.25; }
        100% { transform: scale(1.2) translate(-25px, -20px); opacity: 0.55; }
      }
      @keyframes floatCard {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-8px); }
      }
      @keyframes dash {
        to { stroke-dashoffset: -100; }
      }
      @keyframes ping {
        0% { r: 4px; opacity: 1; }
        75%, 100% { r: 12px; opacity: 0; }
      }
    </style>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="100%" height="100%" fill="url(#bgGradient)" rx="16" />
  <rect width="100%" height="100%" fill="url(#grid)" rx="16" />

  <!-- Dynamic Glowing Orbs in Background -->
  <circle cx="180" cy="80" r="140" fill="url(#glowCyan)" class="glow-pulse-cyan" />
  <circle cx="1020" cy="180" r="160" fill="url(#glowPurple)" class="glow-pulse-purple" />

  <!-- Animated Ambient Circuit / Flow Lines in Deep Background -->
  <path d="M 50 220 Q 250 160 500 210 T 950 170 T 1150 200" fill="none" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="8 6" class="wave-line" />
  <path d="M 100 240 Q 350 290 650 230 T 1100 250" fill="none" stroke="#818cf8" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="6 4" class="wave-line" />

  <!-- Right-Side Floating Metric / Status Cards (Subtle Background Decor) -->
  <g class="data-float" opacity="0.9">
    <!-- Risk Exposure Metric Card -->
    <g transform="translate(860, 45)">
      <rect width="280" height="70" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <circle cx="32" cy="35" r="14" fill="#ef4444" fill-opacity="0.2" />
      <circle cx="32" cy="35" r="6" fill="#ef4444" />
      <text x="58" y="30" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">Portfolio Risk Exposure</text>
      <text x="58" y="52" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">99.4% Monitored</text>
    </g>

    <!-- Obligation & Value Leakage Card -->
    <g transform="translate(890, 135)">
      <rect width="250" height="66" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <circle cx="30" cy="33" r="14" fill="#10b981" fill-opacity="0.2" />
      <circle cx="30" cy="33" r="6" fill="#10b981" />
      <text x="56" y="28" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">Value Leakage Prevented</text>
      <text x="56" y="50" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">$14.2M Identified</text>
    </g>
  </g>

  <!-- Foreground Main Title & Badges (Completely clear, unblocked) -->
  <g transform="translate(60, 65)">
    <!-- Category Pill Tag -->
    <rect width="260" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6" />
    <circle cx="16" cy="14" r="5" fill="#38bdf8" />
    <text x="32" y="19" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">LEGALTECH &amp; GRC DIRECTORY</text>

    <!-- Main Title -->
    <text x="0" y="78" fill="url(#primaryGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5">
      Contract Portfolio Risk &amp; Value
    </text>

    <!-- Subtitle -->
    <text x="0" y="116" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500">
      Enterprise SaaS &amp; Open-Source Obligation Intelligence Ecosystem
    </text>

    <!-- Feature Tags Row -->
    <g transform="translate(0, 142)">
      <!-- Tag 1 -->
      <rect width="140" height="24" rx="6" fill="#1e293b" fill-opacity="0.9" stroke="#475569" stroke-width="1" />
      <text x="12" y="16" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">🛡️ Risk Scoring</text>

      <!-- Tag 2 -->
      <rect x="150" width="168" height="24" rx="6" fill="#1e293b" fill-opacity="0.9" stroke="#475569" stroke-width="1" />
      <text x="162" y="16" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">💰 Value Leakage Audit</text>

      <!-- Tag 3 -->
      <rect x="328" width="176" height="24" rx="6" fill="#1e293b" fill-opacity="0.9" stroke="#475569" stroke-width="1" />
      <text x="340" y="16" fill="#fbcfe8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">📋 Obligation Intelligence</text>

      <!-- Tag 4 -->
      <rect x="514" width="156" height="24" rx="6" fill="#1e293b" fill-opacity="0.9" stroke="#475569" stroke-width="1" />
      <text x="526" y="16" fill="#fde68a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">⚡ AI Contract RAG</text>
    </g>
  </g>
</svg>
